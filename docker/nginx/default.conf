server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    charset utf-8;

    # Servir archivos estáticos directamente con caché
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Regla de enrutamiento equivalente a .htaccess
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar peticiones PHP hacia el contenedor PHP-FPM en el puerto 9000
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Bloquear acceso a archivos ocultos (.htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
