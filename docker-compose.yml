services:
  # Servicio PHP-FPM
  app:
    build: .
    container_name: descargador_php_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

  # Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: descargador_web_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
